packages:
  - apps/*
  - packages/*

# Supply-chain hardening: install scripts are denied unless explicitly allowed.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  # Optional peer of @nestjs/cli, which builds with tsc; SWC is not used.
  '@swc/core': false

# Security patches for transitive dependencies (see docs/security/dependency-policy.md).
overrides:
  mysql2@<3.23.1: 3.24.5
  deepmerge-ts@<8.0.0: 8.0.2

# Accepted audit findings with no published fix. Each entry is justified and
# dated in docs/security/dependency-policy.md and must be re-reviewed by 2026-11-30.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm # braces — mobile dev toolchain only (Metro/Jest)
    - GHSA-86w9-cpqp-85rv # node-forge — Expo CLI dev-server certificates only
