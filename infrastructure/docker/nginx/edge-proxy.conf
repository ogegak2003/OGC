# Upstream headers for every proxied location of the edge (edge.conf.template). Kept in one
# file because nginx does not inherit proxy_set_header into a location that sets its own.
# X-Forwarded-For is set (not appended): the edge is the first trusted hop, so the API
# (TRUST_PROXY_HOPS=1) sees the real client address and nothing a client wrote. X-Request-Id
# is always the edge's own ID, which correlates edge and API logs.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Request-Id $request_id;
proxy_connect_timeout 5s;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Powered-By;
