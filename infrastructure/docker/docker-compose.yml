# OGC local development stack.
#
#   pnpm db:up              # PostgreSQL + Redis (default)
#   docker compose -f infrastructure/docker/docker-compose.yml --profile app up --build
#                           # PostgreSQL + Redis + API + web, as production-like containers
#
# Credentials come from infrastructure/docker/.env (copy .env.example). Ports bind
# to 127.0.0.1 only so local services are not exposed to the network.

name: ogc

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ogc}
      POSTGRES_USER: ${POSTGRES_USER:-ogc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infrastructure/docker/.env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  # Shared ephemeral state: rate limits, presence and realtime fan-out between API instances.
  # Nothing durable lives here (no persistence); losing it only resets counters and presence.
  redis:
    image: redis:8.4.7-alpine
    restart: unless-stopped
    # The official image only drops root when started directly; we start it through sh -c.
    user: redis
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no --maxmemory 256mb --maxmemory-policy volatile-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in infrastructure/docker/.env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - '127.0.0.1:${REDIS_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs:
      - /data:uid=999,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  migrate:
    profiles: [app]
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ogc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ogc}?schema=public
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  api:
    profiles: [app]
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
      target: runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      TRUST_PROXY_HOPS: 1
      # Browsers reach the API same-origin via the web container's /api proxy, so no CORS.
      CORS_ORIGINS: ''
      DATABASE_URL: postgresql://${POSTGRES_USER:-ogc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ogc}?schema=public
      # Database and Redis are reachable only on this Compose network (no TLS needed there).
      DATABASE_TLS: private-network
      REDIS_TLS: private-network
      # Production-like stack without an email provider: verification emails are not sent.
      WEB_APP_URL: https://ogc.localhost
      EMAIL_TRANSPORT: disabled
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Calls: optional STUN/TURN (docs/development/calls.md). Empty = same-network calls only.
      WEBRTC_STUN_URLS: ${WEBRTC_STUN_URLS:-}
      WEBRTC_TURN_URLS: ${WEBRTC_TURN_URLS:-}
      WEBRTC_TURN_SECRET: ${WEBRTC_TURN_SECRET:-}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/v1/health/ready']
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  web:
    profiles: [app]
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
    depends_on:
      - api
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 5s
      retries: 6
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  postgres-data:
